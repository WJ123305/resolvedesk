services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resolvedesk
      POSTGRES_USER: resolvedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvedesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/resolvedesk
      DB_USER: resolvedesk
      DB_PASSWORD: ${DB_PASSWORD:-local-demo-only}
      SERVER_ADDRESS: 0.0.0.0
      DEMO_DATA: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
